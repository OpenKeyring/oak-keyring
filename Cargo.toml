[package]
name = "oak-keyring"
version = "0.7.3"
edition = "2021"
description = "A terminal TUI password manager with TEA architecture and end-to-end encryption"
license = "MIT"

[[bin]]
name = "ok"
path = "src/main.rs"

[dependencies]
# Database
rusqlite = { version = "0.34", default-features = false, features = ["backup"] }
libsqlite3-sys = { version = "0.32.0", optional = true }

# Crypto
argon2 = "0.5"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
sha1 = "0.10"
ureq = { version = "3", features = ["rustls"] }
hex = "0.4"
bip39 = { version = "2.0", features = ["rand", "chinese-simplified"] }
rand = "0.9"
zeroize = { version = "1.8", features = ["derive"] }
secrecy = "0.10"
subtle = "2.5"

# OpVault (1Password .opvault) crypto
pbkdf2 = "0.12"
hmac = "0.12"
aes = "0.8"
cbc = "0.1"
cipher = "0.4"
glob = "0.3"

# Async
tokio = { version = "1", features = ["full", "signal"] }

# TUI
ratatui = "0.30"
crossterm = "0.29"
tachyonfx = "0.22.0"
unicode-width = "0.2"

# Serialization & Config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
base64 = "0.22"

# CSV parsing
csv = "1"

# Regex
regex = "1"

# KeePass .kdbx parsing
keepass = "0.12"

# 1Password .1pux (ZIP) parsing
zip = "2"

# Error handling
thiserror = "2"

# File locking (single instance detection)
fs4 = "0.13"

# Internationalization
rust-i18n = "3"
sys-locale = "0.3"

# Clipboard
arboard = "3"

# Logging
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Cancellation
tokio-util = { version = "0.7", features = ["rt"] }

# OAuth2 / URL parsing
url = "2"

# Sync
opendal = { version = "0.55", features = ["services-memory", "services-fs", "services-gdrive"] }
notify = { version = "7", optional = true }

# String obfuscation
obfstr = "0.4"

# XDG Base Directory specification
home = "0.5"
tui-textarea-2 = "0.11"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
spin = "0.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Memory", "Win32_System_SystemInformation"] }

[target.aarch64-apple-darwin.dependencies]
mach2 = "0.6.0"

[dev-dependencies]
insta = "1"
mockall = "0.13"
tempfile = "3"
anyhow = "1"

[features]
default = ["sqlcipher"]
sqlite-bundled = ["rusqlite/bundled"]
sqlcipher = [
    "dep:libsqlite3-sys",
    "libsqlite3-sys/bundled-sqlcipher-vendored-openssl",
]
test-helpers = []
fs-watcher = ["dep:notify"]

[build-dependencies]

[profile.release]
lto = true
codegen-units = 1
strip = true
